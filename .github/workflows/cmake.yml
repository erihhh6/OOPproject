name: C++ CI

on:
  push:
    branches: ["**"]
    tags:     ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:
    inputs:
      build_type:
        description: Build type
        required: false
        default: Debug
        type: choice
        options: [Debug, Release, RelWithDebInfo, MinSizeRel]

env:
  BUILD_TYPE:      ${{ inputs.build_type || 'Debug' }}
  EXECUTABLE_NAME: oop
  BUILD_DIR:       build

defaults:
  run:
    shell: bash

# ─────────────────────────────────────────────────────────────────────────────
jobs:

  # ── Build & run matrix ─────────────────────────────────────────────────────
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          # ── Linux ──────────────────────────────────────────────────────────
          - name:    "Ubuntu 22.04 — GCC 12 (ASan)"
            os:      ubuntu-22.04
            cc:      gcc-12
            cxx:     g++-12
            flags:   "-DCMAKE_CXX_FLAGS=-fsanitize=address,undefined -DCMAKE_EXE_LINKER_FLAGS=-fsanitize=address,undefined"

          - name:    "Ubuntu 22.04 — Valgrind (GCC 12)"
            os:      ubuntu-22.04
            cc:      gcc-12
            cxx:     g++-12
            flags:   ""
            valgrind: true

          # ── macOS ──────────────────────────────────────────────────────────
          - name:    "macOS 14 — Apple Clang"
            os:      macos-14
            cc:      clang
            cxx:     clang++
            flags:   ""

          - name:    "macOS 14 — GCC 13"
            os:      macos-14
            cc:      gcc-13
            cxx:     g++-13
            flags:   ""

          # ── Windows ────────────────────────────────────────────────────────
          - name:    "Windows 2022 — MSVC"
            os:      windows-2022
            cc:      cl
            cxx:     cl
            flags:   ""

    steps:
      - uses: actions/checkout@v4

      - name: Install Valgrind
        if: matrix.valgrind == true
        run: sudo apt-get install -y valgrind

      - name: Install GCC 13 (macOS)
        if: runner.os == 'macOS' && matrix.cxx == 'g++-13'
        run: brew install gcc@13

      - name: Setup MSVC
        if: matrix.cxx == 'cl'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure CMake
        env:
          CC:  ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: |
          cmake -S . -B ${{ env.BUILD_DIR }} \
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
            ${{ matrix.flags }}

      - name: Build
        run: cmake --build ${{ env.BUILD_DIR }} --config ${{ env.BUILD_TYPE }}

      - name: Run (Unix)
        if: runner.os != 'Windows'
        run: |
          cat input.txt | tr -d '\r' | ./${{ env.BUILD_DIR }}/${{ env.EXECUTABLE_NAME }}

      - name: Run (Windows MSVC)
        if: runner.os == 'Windows' && matrix.cxx == 'cl'
        shell: cmd
        run: |
          type input.txt | .\${{ env.BUILD_DIR }}\${{ env.BUILD_TYPE }}\${{ env.EXECUTABLE_NAME }}.exe

      - name: Valgrind check
        if: matrix.valgrind == true
        run: |
          cat input.txt | tr -d '\r' | valgrind \
            --leak-check=full \
            --show-leak-kinds=all \
            --track-origins=yes \
            --error-exitcode=1 \
            ./${{ env.BUILD_DIR }}/${{ env.EXECUTABLE_NAME }}

  # ── Release (on tag push) ──────────────────────────────────────────────────
  release:
    name: Create Release
    runs-on: ubuntu-22.04
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Build release binary
        run: |
          cmake -S . -B ${{ env.BUILD_DIR }} -DCMAKE_BUILD_TYPE=Release
          cmake --build ${{ env.BUILD_DIR }}

      - name: Package
        run: |
          mkdir release-pkg
          cp ${{ env.BUILD_DIR }}/${{ env.EXECUTABLE_NAME }} release-pkg/
          cp input.txt garden-simulator.html README.md release-pkg/
          cd release-pkg && zip -r ../botanical-garden-${{ github.ref_name }}.zip .

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: botanical-garden-${{ github.ref_name }}.zip
          generate_release_notes: true
